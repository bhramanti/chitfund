<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChitSetu</title>
<meta name="theme-color" content="#1F2A44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChitSetu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Serif+Devanagari:wght@700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5EFDE; --paper-deep:#EEE4C9; --line:#D8C79E;
    --ink:#231F18; --navy:#1F2A44; --maroon:#8C2F39; --gold:#C68A2E; --green:#2F5233; --muted:#726A56;
    --font-display:'Fraunces','Noto Serif Devanagari',serif;
    --font-body:'Inter','Noto Sans Devanagari',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --max-w:480px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#DCD0AA;}
  body{
    font-family:var(--font-body); color:var(--ink); min-height:100vh;
    display:flex; justify-content:center;
  }
  #app{
    width:100%; max-width:var(--max-w); min-height:100vh; background:var(--paper);
    display:flex; flex-direction:column; position:relative;
    box-shadow:0 0 30px rgba(0,0,0,.15);
  }
  .desktop-hint{
    display:none; position:fixed; top:10px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:var(--paper); font-size:12px; padding:6px 14px; border-radius:20px; z-index:99;
  }
  @media (min-width:560px){ .desktop-hint{display:block;} }

  header.topbar{
    background:var(--navy); color:var(--paper); padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    position:sticky; top:0; z-index:10;
  }
  header.topbar h1{font-family:var(--font-display);font-size:19px;margin:0;font-weight:700;}
  header.topbar .role-tag{font-size:9.5px; background:var(--gold); color:#3a2a08; padding:1px 7px; border-radius:9px; font-weight:700; letter-spacing:.3px;}
  header.topbar button{background:none;border:1px solid rgba(245,239,222,.4);color:var(--paper);font-size:12px;padding:5px 10px;border-radius:14px;}
  header.topbar .tb-user{display:flex;align-items:center;gap:10px;}
  header.topbar .avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#3a2a08;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:18px;flex-shrink:0;}
  header.topbar .tb-meta{display:flex;flex-direction:column;gap:2px;}
  header.topbar .tb-name{font-family:var(--font-display);font-size:16px;font-weight:700;line-height:1;}

  main{flex:1; padding:16px 16px 90px; overflow-y:auto;}

  .card{background:var(--paper-deep);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;position:relative;}
  .card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;background:var(--maroon);opacity:.5;border-radius:2px;}
  .card h2{font-family:var(--font-display);font-size:17px;margin:0 0 6px;color:var(--navy);}
  .card p.desc{color:var(--muted);font-size:12.5px;margin:0 0 12px;}

  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;}
  input[type=text],input[type=number],input[type=tel],input[type=password]{
    width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);background:var(--paper);border-radius:6px;color:var(--ink);
  }
  input:focus{outline:2px solid var(--navy);}
  .file-btn{display:block;width:100%;text-align:center;padding:11px;border:1px dashed var(--line);border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer;background:var(--paper);}
  .qr-preview{width:70px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin-top:8px;}

  button.btn{
    width:100%;font-family:var(--font-body);font-weight:700;font-size:15px;padding:13px;border-radius:8px;
    border:1px solid var(--navy);background:var(--navy);color:var(--paper);cursor:pointer;margin-top:14px;
  }
  button.btn.secondary{background:transparent;color:var(--navy);}
  button.btn.maroon{background:var(--maroon);border-color:var(--maroon);}
  button.btn.green{background:var(--green);border-color:var(--green);}
  button.btn:disabled{opacity:.45;}
  button.link-btn{background:none;border:none;color:var(--navy);font-size:13px;font-weight:600;text-decoration:underline;padding:6px 0;}
  .small-btn{font-size:12px;padding:6px 12px;border-radius:14px;border:1px solid var(--navy);background:var(--navy);color:var(--paper);font-weight:600;}
  .small-btn.secondary{background:transparent;color:var(--navy);}
  .small-btn.maroon{background:var(--maroon);border-color:var(--maroon);}

  .tabs{display:flex;justify-content:center;gap:6px;margin-bottom:6px;}
  .tab-toggle{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border:1px solid var(--line);}
  .tab-toggle.active{background:var(--navy);color:var(--paper);border-color:var(--navy);}

  .list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .list-item:last-child{border-bottom:none;}
  .list-item .who{font-size:14px;font-weight:600;}
  .list-item .meta{font-size:11.5px;color:var(--muted);}
  .amt{font-family:var(--font-mono);}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;}
  .tag.won{background:rgba(198,138,46,.25);color:#7a5518;}
  .tag.wait{background:rgba(31,42,68,.1);color:var(--navy);}
  .tag.paid{background:rgba(47,82,51,.2);color:var(--green);}
  .tag.unpaid{background:rgba(140,47,57,.16);color:var(--maroon);}
  .tag.active{background:rgba(47,82,51,.2);color:var(--green);}
  .tag.completed{background:rgba(31,42,68,.1);color:var(--navy);}

  .empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:6px;}
  .error-box{background:rgba(140,47,57,.1);border:1px solid var(--maroon);color:var(--maroon);font-size:13px;padding:9px 12px;border-radius:6px;margin-bottom:10px;}
  .ok-box{background:rgba(47,82,51,.1);border:1px solid var(--green);color:var(--green);font-size:13px;padding:9px 12px;border-radius:6px;margin-bottom:10px;}

  nav.bottomnav{
    position:sticky; bottom:0; background:var(--navy); display:flex; z-index:10;
    box-shadow:0 -2px 10px rgba(0,0,0,.15);
  }
  nav.bottomnav button{
    flex:1;background:none;border:none;color:rgba(245,239,222,.55);font-size:11px;font-weight:600;
    padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  nav.bottomnav button .ic{font-size:18px;}
  nav.bottomnav button.active{color:var(--paper);}
  nav.bottomnav button.active .ic{color:var(--gold);}

  .center-screen{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 0px);padding:26px 22px;}
  .brand{text-align:center;margin-bottom:18px;}
  .brand-logo{display:flex;justify-content:center;margin-bottom:6px;}
  .brand-logo svg{filter:drop-shadow(0 3px 6px rgba(140,47,57,.2));}
  .brand h1{font-family:var(--font-display);color:var(--navy);font-size:26px;margin:0;}
  .brand p{color:var(--muted);font-size:12.5px;margin:4px 0 0;}

  .draw-stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0;}
  .matka svg{width:90px;height:82px;}
  .chits{position:relative;width:180px;height:52px;}
  .chit{position:absolute;width:26px;height:38px;background:var(--paper);border:1px solid var(--ink);border-radius:2px;left:50%;top:0;box-shadow:0 2px 3px rgba(0,0,0,.15);}
  .chit.shuffling{animation:shuffle 1.3s ease-in-out infinite;}
  @keyframes shuffle{0%{transform:translateX(-50%) rotate(-6deg);}25%{transform:translateX(-68%) translateY(-6px) rotate(8deg);}50%{transform:translateX(-30%) translateY(2px) rotate(-10deg);}75%{transform:translateX(-60%) translateY(-4px) rotate(5deg);}100%{transform:translateX(-50%) rotate(-6deg);}}
  .winner-stamp{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--maroon);border:3px solid var(--maroon);padding:8px 18px;border-radius:8px;transform:rotate(-3deg) scale(0);opacity:0;animation:stampIn .4s cubic-bezier(.2,1.4,.4,1) forwards;text-align:center;}
  @keyframes stampIn{to{transform:rotate(-3deg) scale(1);opacity:1;}}

  .qr-share-box{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:10px;}
  .qr-share-box img{width:56px;height:56px;border-radius:4px;object-fit:cover;border:1px solid var(--line);}

  .share-link-box{background:var(--paper);border:1px dashed var(--line);border-radius:6px;padding:12px;text-align:center;margin-top:10px;}
  .share-link-box img{width:130px;height:130px;margin:8px auto;display:block;}
  .share-link-box code{display:block;font-size:11px;word-break:break-all;color:var(--muted);margin-bottom:8px;}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--paper);
    padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  h3.section-h{font-family:var(--font-display);font-size:15px;color:var(--navy);margin:18px 0 8px;}

  /* ---- App-सारखा अनुभव: transitions, skeletons, polish ---- */
  @media (prefers-reduced-motion: no-preference){
    main{animation:fadeUp .28s ease;}
    .card{animation:fadeUp .32s ease both;}
    #mainArea > .card:nth-child(2){animation-delay:.04s;}
    #mainArea > .card:nth-child(3){animation-delay:.08s;}
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  button.btn,.small-btn,.tab-toggle,nav.bottomnav button{transition:transform .12s ease, background .18s ease, color .18s ease, box-shadow .18s ease;}
  button.btn:active,.small-btn:active{transform:scale(.97);}
  button.btn:not(:disabled):hover{box-shadow:0 3px 10px rgba(31,42,68,.18);}
  .list-item[data-fund],.list-item[data-tab]{transition:background .15s ease;}
  .list-item[data-fund]:active{background:rgba(31,42,68,.05);}

  /* Skeleton shimmer */
  .sk{background:linear-gradient(100deg,var(--paper-deep) 30%,#e6dcc0 50%,var(--paper-deep) 70%);background-size:200% 100%;animation:sheen 1.2s ease-in-out infinite;border-radius:6px;}
  @keyframes sheen{from{background-position:200% 0;}to{background-position:-200% 0;}}
  .sk-line{height:13px;margin:8px 0;}
  .sk-line.w60{width:60%;} .sk-line.w40{width:40%;} .sk-line.w80{width:80%;}
  .sk-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .sk-row:last-child{border-bottom:none;}
  .sk-pill{width:64px;height:22px;border-radius:11px;}
  .sk-title{height:20px;width:55%;margin-bottom:10px;}

  /* Empty state — कृतीचं आवाहन */
  .empty2{text-align:center;padding:30px 18px;border:1px dashed var(--line);border-radius:10px;background:var(--paper);}
  .empty2 .e-ic{font-size:34px;display:block;margin-bottom:8px;opacity:.8;}
  .empty2 .e-title{font-family:var(--font-display);font-size:16px;color:var(--navy);margin-bottom:4px;}
  .empty2 .e-sub{font-size:12.5px;color:var(--muted);line-height:1.4;}

  /* Bottom nav active indicator */
  nav.bottomnav button{position:relative;}
  nav.bottomnav button.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;background:var(--gold);border-radius:0 0 3px 3px;}

  /* Section header — छोटी accent रेष */
  h3.section-h{display:flex;align-items:center;gap:8px;}
  h3.section-h::after{content:"";flex:1;height:1px;background:var(--line);}

  .modal-overlay{position:fixed;inset:0;background:rgba(35,31,24,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;}
  .modal-card{background:var(--paper);border-radius:12px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);border:2px solid var(--gold);}
  .modal-card .party{font-size:44px;margin-bottom:6px;}
  .modal-card h2{font-family:var(--font-display);color:var(--maroon);font-size:22px;margin:0 0 4px;}
  .modal-card .wname{font-family:var(--font-display);font-size:26px;color:var(--navy);margin:8px 0;font-weight:700;}
  .modal-card p{color:var(--muted);font-size:13px;margin:4px 0;}
  .modal-card .amt-big{font-family:var(--font-mono);font-size:20px;color:var(--green);font-weight:700;margin:8px 0;}

  .install-bar{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);bottom:0;width:100%;max-width:var(--max-w);
    background:var(--navy);color:var(--paper);padding:14px 16px;z-index:80;box-shadow:0 -3px 14px rgba(0,0,0,.25);
    display:flex;align-items:center;gap:12px;transition:transform .35s cubic-bezier(.2,.9,.3,1);}
  .install-bar.show{transform:translateX(-50%) translateY(0);}
  .install-bar .ib-ic{font-size:26px;}
  .install-bar .ib-txt{flex:1;font-size:12.5px;line-height:1.35;}
  .install-bar .ib-txt b{font-family:var(--font-display);font-size:14px;}
  .install-bar button{border:none;border-radius:16px;font-weight:700;font-size:12.5px;padding:8px 14px;cursor:pointer;}
  .install-bar .ib-add{background:var(--gold);color:#3a2a08;}
  .install-bar .ib-close{background:transparent;color:rgba(245,239,222,.7);font-size:18px;padding:4px 8px;}
  .ios-tip{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12px;color:var(--ink);}
  .ios-tip .shareic{display:inline-block;border:1px solid var(--navy);border-radius:5px;padding:0 5px;font-weight:700;}
</style>
</head>
<body>
<div class="desktop-hint">📱 हे अ‍ॅप मोबाईलसाठी डिझाइन केलेलं आहे — मोबाईलवर उघडा किंवा ब्राउझर विंडो अरुंद करा</div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="install-bar" id="installBar">
  <span class="ib-ic">📲</span>
  <div class="ib-txt" id="ibTxt"><b>अ‍ॅप होम स्क्रीनवर ठेवा</b><br>पटकन उघडण्यासाठी आयकॉनसारखं जोडा.</div>
  <button class="ib-add" id="ibAdd">जोडा</button>
  <button class="ib-close" id="ibClose">✕</button>
</div>

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// पेमेंट-स्क्रीनशॉट अपलोड करण्याआधी कॉम्प्रेस करून WebP मध्ये बदलतो (आकार लहान रहावा म्हणून).
// जुन्या Safari/iPhone browsers WebP encode करू शकत नाहीत — अशा वेळी आपोआप JPEG वर पडतो (compressed राहतंच).
function compressImageToWebp(file, maxDim = 1280, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale); height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        let out = canvas.toDataURL("image/webp", quality);
        if (!out.startsWith("data:image/webp")) out = canvas.toDataURL("image/jpeg", quality); // fallback
        resolve(out);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- सुरक्षा: HTML-escape ---------------- */
// नाव/फोन/UPI/मेसेज सारखा युजर-input डेटा innerHTML मध्ये टाकण्याआधी नेहमी escape करा —
// नाहीतर कोणीही signup करताना नावात <script> टाकून दुसऱ्या युजरच्या (उदा. Admin च्या) browser मध्ये
// तो कोड चालवू शकतो (stored XSS). प्रत्येक ठिकाणी DB मधून आलेला मजकूर दाखवताना esc() वापरा.
function esc(v) {
  if (v == null) return "";
  return String(v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function T(key) {
  const val = key.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), UI_STRINGS[uiLang] || UI_STRINGS.mr);
  return val !== undefined ? val : key;
}

const app = document.getElementById("app");

function route(view) {
  if (!session && view !== "auth") view = "auth";
  if (session && session.status !== "approved") { renderPending(); return; }
  if (view === "auth") renderAuth();
  else renderShell();
}

function renderLoginForm() {
  const S = AUTH_STRINGS[authLang];
  const c = document.getElementById("authCard");
  const saved = JSON.parse(localStorage.getItem("cf_remember") || "null");
  c.innerHTML = `
    <p class="desc">${S.loginDesc}</p>
    <div id="authMsg"></div>
    <label>${S.loginPhoneLabel}</label>
    <input type="tel" id="loginPhone" placeholder="9876543210" inputmode="numeric" value="${saved?.phone ? String(saved.phone).replace(/"/g,'&quot;') : ''}">
    <label>${S.pinLabel}</label>
    <input type="password" id="loginPin" placeholder="PIN" inputmode="numeric" value="${saved?.pin ? String(saved.pin).replace(/"/g,'&quot;') : ''}">
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600;color:var(--ink);cursor:pointer;">
      <input type="checkbox" id="loginRemember" ${saved ? 'checked' : ''} style="width:18px;height:18px;">
      ${S.remember}
    </label>
    <button class="btn" id="loginBtn">${S.loginBtn}</button>`;
  document.getElementById("loginBtn").onclick = async () => {
    const phone = document.getElementById("loginPhone").value.trim();
    const pin = document.getElementById("loginPin").value.trim();
    const remember = document.getElementById("loginRemember").checked;
    if (!phone || !pin) return showAuthMsg(S.loginPhoneLabel + " + PIN", true);
    const btn = document.getElementById("loginBtn");
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>...';
    try {
      const { profile } = await api("login", { phone, pin });
      if (remember) localStorage.setItem("cf_remember", JSON.stringify({ phone, pin }));
      else localStorage.removeItem("cf_remember");
      setSession(profile);
      route("app");
    } catch (e) { showAuthMsg(e.message, true); btn.disabled=false; btn.textContent=S.loginBtn; }
  };
}

/* ---------------- विजेता Popup ---------------- */
async function checkWinnerAlerts() {
  try {
    const { alerts } = await api("myAlerts", { profile_id: session.id });
    if (!alerts || !alerts.length) return;
    const seenKey = "cf_seen_alerts_" + session.id;
    const seen = JSON.parse(localStorage.getItem(seenKey) || "[]");
    // सध्याच्या सगळ्या फेऱ्या seen म्हणून नोंदवा — म्हणजे जुन्या चिठ्ठ्या पुन्हा-पुन्हा popup होणार नाहीत
    const markAllSeen = () => {
      const merged = Array.from(new Set(seen.concat(alerts.map(a => a.round_id))));
      localStorage.setItem(seenKey, JSON.stringify(merged.slice(-100)));
    };
    // फक्त सर्वात अलीकडची चिठ्ठी, आणि तीही न बघितली असेल तरच — एकदाच
    const latest = alerts[0];
    if (seen.includes(latest.round_id)) { markAllSeen(); return; }
    showWinnerModal(latest, markAllSeen);
  } catch (e) {}
}

function showWinnerModal(a, onClose) {
  const ov = document.createElement("div");
  ov.className = "modal-overlay";
  ov.innerHTML = `
    <div class="modal-card">
      <div class="party">🎉</div>
      <h2>${esc(a.fund_name)}</h2>
      <p>${T('winnerModal.monthDraw')(a.month_number)}</p>
      <div class="wname">${a.is_me ? T('winnerModal.youWon') : esc(a.winner_name)}</div>
      <div class="amt-big">₹${Number(a.amount).toLocaleString('en-IN')}</div>
      <p>${a.is_me ? T('winnerModal.othersPaid') : T('winnerModal.sendToWinner')}</p>
      <button class="btn" id="modalOk">${T('winnerModal.ok')}</button>
    </div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); if (onClose) onClose(); };
  document.getElementById("modalOk").onclick = close;
  ov.onclick = (e) => { if (e.target === ov) close(); };
}

async function renderFundsTab() {
  const main = document.getElementById("mainArea");
  main.innerHTML = (session.role === "admin" ? skeletonCard() : "") + skeletonList(3);

    let html = "";
    if (session.role === "admin") {
      html += `
        <div class="card">
          <h2>${T('fundsTab.newFundHeading')}</h2>
          <label>${T('fundsTab.nameLabel')}</label>
          <input type="text" id="nfName" placeholder="${T('fundsTab.namePlaceholder')}">

          <button class="btn" id="nfBtn">${T('fundsTab.createBtn')}</button>
        </div>`;
    }
    html += `<h3 class="section-h">${T('fundsTab.yourFunds')}</h3>`;
    if (!list.length) html += session.role === "admin"
      ? emptyState("📒", T('fundsTab.emptyTitle'), T('fundsTab.emptyAdminSub'))
      : emptyState("📒", T('fundsTab.emptyTitle'), T('fundsTab.emptyMemberSub'));
    else {
      html += `<div class="card">` + list.map(f => `
        <div class="list-item" style="cursor:pointer" data-fund="${f.id}">
          <div>
            <div class="who">${esc(f.name)}</div>
            <div class="meta">₹${Number(f.installment).toLocaleString('en-IN')}${T('fundsTab.perMonth')}</div>
          </div>
          <span class="tag ${f.status}">${f.status==='active'?T('common.active'):T('common.completed')}</span>
        </div>`).join('') + `</div>`;
    }
    main.innerHTML = html;
    if (session.role === "admin") {
      document.getElementById("nfBtn").onclick = async () => {
        const name = document.getElementById("nfName").value.trim();
        const installment = parseFloat(document.getElementById("nfInst").value);
        if (!name || !installment) return toast(T('fundsTab.fillNameInst'));
        try { await api("createFund", { profile_id: session.id, name, installment }); toast(T('fundsTab.created')); renderFundsTab(); }
        catch (e) { toast(e.message); }
      };
    }
    main.querySelectorAll("[data-fund]").forEach(el => el.onclick = () => { currentFundId = el.dataset.fund; renderFundDetail(currentFundId); });
  } catch (e) { main.innerHTML = `<div class="error-box">${e.message}</div>`; }
}

    </div>`;
  document.body.appendChild(ov);
  let proofBase64 = null;
  const close = () => ov.remove();
  document.getElementById("ppPick").onclick = () => document.getElementById("ppFile").click();
  document.getElementById("ppFile").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    document.getElementById("ppPick").textContent = T('paymentProof.compressing');
    try {
      proofBase64 = await compressImageToWebp(f);
      const img = document.getElementById("ppPrev");
      img.src = proofBase64; img.style.display = "block";
      document.getElementById("ppPick").textContent = T('paymentProof.pickAnother');
    } catch (e) { toast(T('paymentProof.photoFail')); document.getElementById("ppPick").textContent = T('paymentProof.pick'); }
  };
  const submit = async (withProof) => {
    try {
      await api("markPayment", { profile_id: session.id, round_id, target_profile_id, paid: true, proof_base64: withProof ? proofBase64 : null });
      close();
      renderFundDetail(fundId);
    } catch (e) { toast(e.message); }
  };
  document.getElementById("ppSave").onclick = () => submit(!!proofBase64);
  document.getElementById("ppSkip").onclick = () => submit(false);
  document.getElementById("ppCancel").onclick = close;
  ov.onclick = (e) => { if (e.target === ov) close(); };
}

/* ---------------- FUND DETAIL ---------------- */
async function renderFundDetail(fundId) {
  const main = document.getElementById("mainArea");
  main.innerHTML = skeletonCard() + skeletonList(4);
  try {
    const { fund, members, rounds, payments } = await api("getFund", { profile_id: session.id, fund_id: fundId });
    const isAdmin = session.role === "admin";
    const wonIds = new Set(rounds.map(r => r.winner_profile_id));
    const eligible = members.filter(m => !wonIds.has(m.id));
    const lastRound = rounds[rounds.length - 1];
    const appUrl = location.href.split('#')[0].split('?')[0];

    let html = `
      <button class="link-btn" id="backBtn">${T('fundDetail.backAll')}</button>
      <div class="card">
        <h2>${esc(fund.name)} <span class="tag ${fund.status}" style="margin-left:6px;">${fund.status==='active'?T('common.active'):T('common.completed')}</span></h2>
        <p class="desc">${T('fundDetail.perMemberMonth')(Number(fund.installment).toLocaleString('en-IN'), members.length, `${rounds.length}/${members.length||0}`)}</p>
        ${isAdmin ? `<div style="display:flex;gap:6px;margin-top:6px;">
          <button class="small-btn secondary" id="editFundBtn">${T('fundDetail.editFund')}</button>
          <button class="small-btn maroon" id="deleteFundBtn">${T('fundDetail.deleteFund')}</button>
        </div>` : ''}
      </div>`;

    if (isAdmin && fund.status === 'active') {
      html += `
        <div class="card">
          <h2>${T('fundDetail.addMemberHeading')}</h2>
          <select id="addMemberSelect" style="width:100%;padding:11px;border-radius:6px;border:1px solid var(--line);font-size:14px;background:var(--paper);"></select>
          <button class="btn secondary" id="addMemberBtn">${T('fundDetail.addToFund')}</button>
          <button class="btn secondary" id="shareLinkBtn" style="margin-top:8px;">${T('fundDetail.shareSignup')}</button>
        </div>`;
    }

    html += `<h3 class="section-h">${T('fundDetail.membersHeading')(members.length)}</h3><div class="card">`;
    html += members.length ? members.map(m => `
      <div class="list-item">
        <div><div class="who">${esc(m.name)}${m.id===session.id?T('common.you'):''}</div><div class="meta">${esc(m.phone)||''}</div></div>
        <span class="tag ${wonIds.has(m.id)?'won':'wait'}">${wonIds.has(m.id)?T('common.won'):T('common.waiting')}</span>
      </div>`).join('') : emptyState("👥", T('fundDetail.noMembers'), isAdmin ? T('fundDetail.noMembersAdminSub') : T('fundDetail.noMembersMemberSub'));
    html += `</div>`;

    if (isAdmin && fund.status === 'active') {
      html += `
        <div class="card">
          <h2>${T('fundDetail.drawHeading')}</h2>
          <div class="draw-stage" id="drawStage">
            <div class="matka"><svg viewBox="0 0 100 90"><path d="M20 30 Q10 60 30 80 Q50 92 70 80 Q90 60 80 30 Q75 15 50 12 Q25 15 20 30 Z" fill="#C68A2E" stroke="#8C2F39" stroke-width="3"/><ellipse cx="50" cy="14" rx="16" ry="6" fill="#EEE4C9" stroke="#8C2F39" stroke-width="2"/></svg></div>
            <div id="drawResult"></div>
            <button class="btn maroon" id="drawBtn" ${eligible.length===0||members.length===0?'disabled':''}>${T('fundDetail.drawBtn')}</button>
            <button class="btn secondary" id="manualDrawBtn" style="margin-top:8px;" ${eligible.length===0||members.length===0?'disabled':''}>${T('fundDetail.manualDrawBtn')}</button>
            <div id="manualDrawBox" style="display:none;width:100%;margin-top:10px;text-align:left;">
              <label>${T('fundDetail.manualDrawSelectLabel')}</label>
              <select id="manualDrawSelect" style="width:100%;padding:11px;border-radius:6px;border:1px solid var(--line);font-size:14px;background:var(--paper);">
                ${eligible.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}
              </select>
              <p style="font-size:11.5px;color:var(--muted);margin:6px 0 0;">${T('fundDetail.manualDrawNote')}</p>
              <button class="btn maroon" id="manualDrawConfirmBtn" style="margin-top:8px;">${T('fundDetail.manualDrawConfirmBtn')}</button>
            </div>
            ${eligible.length===0 && members.length>0 ? `<p style="font-size:12px;color:var(--muted);">${T('fundDetail.allWon')}</p>` : ''}
            ${rounds.length>0 ? `<button class="btn secondary" id="undoDrawBtn" style="margin-top:8px;">${T('fundDetail.undoDraw')(lastRound.month_number)}</button>` : ''}
          </div>
        </div>`;
    }

    if (lastRound) {
      const roundPayments = payments.filter(p => p.round_id === lastRound.id);
      const winner = members.find(m => m.id === lastRound.winner_profile_id);
      const paidCount = roundPayments.filter(p => p.paid).length;
      html += `<h3 class="section-h">${T('fundDetail.collectionHeading')(lastRound.month_number, paidCount, members.length)}${lastRound.is_manual ? ` <span class="tag wait" style="font-size:9.5px;">${T('common.adminPick')}</span>` : ''}</h3><div class="card">`;
      html += members.map(m => {
        const p = roundPayments.find(x => x.profile_id === m.id);
        const paid = p ? p.paid : false;
        const overdue = p ? !!p.overdue : false;
        const canToggle = isAdmin || m.id === session.id;
        return `<div class="list-item">
          <div><div class="who">${esc(m.name)}${m.id===lastRound.winner_profile_id?' 🏆':''}</div><div class="meta amt">₹${Number(fund.installment).toLocaleString('en-IN')}</div></div>
          ${overdue ? `<span class="tag unpaid" style="margin-right:4px;">${T('fundDetail.overdueTag')}</span>` : ''}
          ${p && p.proof_url ? `<a href="${p.proof_url}" target="_blank" rel="noopener" style="margin-right:4px;font-size:16px;text-decoration:none;" title="${T('fundDetail.viewProofTitle')}">🧾</a>` : ''}
          ${canToggle ? `<span class="tag ${paid?'paid':'unpaid'}" style="cursor:pointer" data-toggle-pay="${m.id}" data-round="${lastRound.id}" data-paid="${paid}">${paid?T('fundDetail.paidTag'):T('fundDetail.unpaidTapTag')}</span>`
            : `<span class="tag ${paid?'paid':'unpaid'}">${paid?T('fundDetail.paidTag'):T('fundDetail.unpaidTag')}</span>`}
        </div>`;
      }).join('');
      if (isAdmin && paidCount < members.length) {
        html += `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
          <button class="btn maroon" id="remindBtn" style="margin-top:0;flex:1;">${T('fundDetail.remindBtn')}</button>
          <button class="btn secondary" id="resendBtn" style="margin-top:0;flex:1;">${T('fundDetail.resendBtn')}</button>
        </div>`;
      }
      if (isAdmin) {
        html += `<button class="btn secondary" id="shareLedgerBtn" style="margin-top:8px;">${T('fundDetail.shareLedgerBtn')}</button>`;
      }
      html += `</div>`;
      if (winner && winner.id !== session.id) {
        html += `
          <div class="card">
            <h2>${T('fundDetail.sendToWinnerHeading')}</h2>
            <p class="desc">${T('fundDetail.winnerLine')(esc(winner.name), Number(fund.installment).toLocaleString('en-IN'))}</p>
            <div class="qr-share-box">
              ${winner.qr_url ? `<img src="${winner.qr_url}">` : ''}
              <div style="font-size:13px;"><b>${T('fundDetail.upiIdLabel')}</b><br>${esc(winner.upi_id) || T('common.notGiven')}</div>
            </div>
          </div>`;
      }
    }

    html += `<h3 class="section-h">${T('fundDetail.recordHeading')}</h3><div class="card">`;
    html += rounds.length ? rounds.map(r => {
      const w = members.find(m => m.id === r.winner_profile_id);
      const rp = payments.filter(p => p.round_id === r.id && p.paid).length;
      return `<div class="list-item">
        <div><div class="who">${T('fundDetail.recordLine')(r.month_number, w?esc(w.name):'—')}${r.is_manual ? ` <span class="tag wait" style="font-size:9px;">${T('common.adminPick')}</span>` : ''}</div><div class="meta">${T('fundDetail.collectedOf')(rp, members.length)}</div></div>
        <span class="amt">₹${Number(r.amount).toLocaleString('en-IN')}</span>
      </div>`;
    }).join('') : emptyState("🎟", T('fundDetail.noDraws'), isAdmin ? T('fundDetail.noDrawsAdminSub') : T('fundDetail.noDrawsMemberSub'));
    html += `</div>`;

    if (isAdmin && fund.status === 'active' && eligible.length === 0 && members.length>0) {
      html += `<button class="btn secondary" id="completeFundBtn">${T('fundDetail.completeFundBtn')}</button>`;
    }

    main.innerHTML = html;
    document.getElementById("backBtn").onclick = () => { currentFundId = null; renderShell(); };

    if (isAdmin && fund.status === 'active') {
      try {
        const { list: allProfiles } = await api("listProfiles", { profile_id: session.id });
        const memberIds = new Set(members.map(m => m.id));
        const avail = allProfiles.filter(p => !memberIds.has(p.id));
        const sel = document.getElementById("addMemberSelect");
        sel.innerHTML = avail.length ? avail.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('') : `<option value="">${T('fundDetail.noneAvailable')}</option>`;
        document.getElementById("addMemberBtn").onclick = async () => {
          const target_id = sel.value;
          if (!target_id) return toast(T('fundDetail.noOneSelected'));
          try {
            const { catchUpRounds } = await api("addMemberToFund", { profile_id: session.id, fund_id: fundId, target_id });
            toast(catchUpRounds > 0 ? T('fundDetail.memberAddedCatchUp')(catchUpRounds) : T('fundDetail.memberAdded'));
            renderFundDetail(fundId);
          }
          catch (e) { toast(e.message); }
        };
      } catch (e) {}
      document.getElementById("shareLinkBtn").onclick = () => openShareLink(appUrl + "?signup");

      const drawBtn = document.getElementById("drawBtn");
      if (drawBtn) drawBtn.onclick = async () => {
        drawBtn.disabled = true;
        const stage = document.getElementById("drawResult");
        stage.innerHTML = `<div class="chits">${[0,1,2,3,4].map(i=>`<div class="chit shuffling" style="animation-delay:${i*.08}s"></div>`).join('')}</div>`;
        try {
          await new Promise(r => setTimeout(r, 1300));
          const { winner } = await api("drawWinner", { profile_id: session.id, fund_id: fundId });
          stage.innerHTML = `<div class="winner-stamp">🎉 ${esc(winner.name)}</div>`;
          toast(T('fundDetail.drawnToast')(winner.name));
          setTimeout(() => renderFundDetail(fundId), 1600);
        } catch (e) { toast(e.message); drawBtn.disabled = false; stage.innerHTML=''; }
      };

      const manualDrawBtn = document.getElementById("manualDrawBtn");
      const manualDrawBox = document.getElementById("manualDrawBox");
      if (manualDrawBtn) manualDrawBtn.onclick = () => {
        manualDrawBox.style.display = manualDrawBox.style.display === "none" ? "block" : "none";
      };
      const manualDrawConfirmBtn = document.getElementById("manualDrawConfirmBtn");
      if (manualDrawConfirmBtn) manualDrawConfirmBtn.onclick = async () => {
        const target_id = document.getElementById("manualDrawSelect").value;
        if (!target_id) return toast(T('fundDetail.selectMember'));
        const pick = eligible.find(m => m.id === target_id);
        if (!confirm(T('fundDetail.manualConfirm')(pick?.name))) return;
        manualDrawConfirmBtn.disabled = true;
        try {
          const { winner } = await api("drawWinnerManual", { profile_id: session.id, fund_id: fundId, target_id });
          toast(T('fundDetail.manualDrawnToast')(winner.name));
          renderFundDetail(fundId);
        } catch (e) { toast(e.message); manualDrawConfirmBtn.disabled = false; }
      };

      const undoBtn = document.getElementById("undoDrawBtn");
      if (undoBtn) undoBtn.onclick = async () => {
        if (!confirm(T('fundDetail.undoConfirm')(lastRound.month_number))) return;
        try {
          const res = await api("undoLastDraw", { profile_id: session.id, fund_id: fundId });
          if (res.needsConfirm) {
            if (!confirm(res.error)) return;
            await api("undoLastDraw", { profile_id: session.id, fund_id: fundId, force: true });
          }
          toast(T('fundDetail.undone')); renderFundDetail(fundId);
        } catch (e) { toast(e.message); }
      };
    }

    main.querySelectorAll("[data-toggle-pay]").forEach(el => {
      el.onclick = async () => {
        const target_profile_id = el.dataset.togglePay;
        const round_id = el.dataset.round;
        const paid = el.dataset.paid !== "true";
        // स्वतःचं पेमेंट "भरला" करताना — वादावाद टाळण्यासाठी स्क्रीनशॉट जोडायला (ऐच्छिक) विचारतो
        if (paid && target_profile_id === session.id) {
          openPaymentProofPrompt(round_id, target_profile_id, fundId);
          return;
        }
        try { await api("markPayment", { profile_id: session.id, round_id, target_profile_id, paid }); renderFundDetail(fundId); }
        catch (e) { toast(e.message); }
      };
    });

    const remindBtn = document.getElementById("remindBtn");
    if (remindBtn && lastRound) remindBtn.onclick = async () => {
      remindBtn.disabled = true; remindBtn.innerHTML = '<span class="spinner"></span>' + T('common.sending');
      try {
        const { sent, failed } = await api("remindUnpaid", { profile_id: session.id, round_id: lastRound.id });
        toast(failed && failed.length ? T('fundDetail.remindPartial')(sent, failed) : T('fundDetail.remindSent')(sent));
      }
      catch (e) { toast(e.message); }
      remindBtn.disabled = false; remindBtn.innerHTML = T('fundDetail.remindBtn');
    };
    const resendBtn = document.getElementById("resendBtn");
    if (resendBtn && lastRound) resendBtn.onclick = async () => {
      resendBtn.disabled = true; resendBtn.innerHTML = '<span class="spinner"></span>' + T('common.sending');
      try {
        const { sent, failed } = await api("resendWinnerInfo", { profile_id: session.id, round_id: lastRound.id });
        toast(failed && failed.length ? T('fundDetail.resendPartial')(sent, failed.length) : T('fundDetail.resendSent')(sent));
      }
      catch (e) { toast(e.message); }
      resendBtn.disabled = false; resendBtn.innerHTML = T('fundDetail.resendBtn');
    };
    const shareLedgerBtn = document.getElementById("shareLedgerBtn");
    if (shareLedgerBtn && lastRound) shareLedgerBtn.onclick = async () => {
      if (!confirm(T('fundDetail.shareLedgerConfirm')(lastRound.month_number))) return;
      shareLedgerBtn.disabled = true; shareLedgerBtn.innerHTML = '<span class="spinner"></span>' + T('common.sending');
      try {
        const { sent, failed } = await api("shareLedger", { profile_id: session.id, round_id: lastRound.id });
        toast(failed && failed.length ? T('fundDetail.resendPartial')(sent, failed.length) : T('fundDetail.shareLedgerSent')(sent));
      }
      catch (e) { toast(e.message); }
      shareLedgerBtn.disabled = false; shareLedgerBtn.innerHTML = T('fundDetail.shareLedgerBtn');
    };

    const completeBtn = document.getElementById("completeFundBtn");
    if (completeBtn) completeBtn.onclick = async () => {
      if (!confirm(T('fundDetail.completeConfirm'))) return;
      await api("completeFund", { profile_id: session.id, fund_id: fundId });
      toast(T('fundDetail.completed'));
      currentFundId = null; renderShell();
    };

    const editFundBtn = document.getElementById("editFundBtn");
    if (editFundBtn) editFundBtn.onclick = () => {
      const canEditInst = rounds.length === 0;
      const box = document.createElement("div");
      box.className = "card";
      box.innerHTML = `
        <h2>${T('fundDetail.editHeading')}</h2>
        <label>${T('fundDetail.editNameLabel')}</label>
        <input type="text" id="efName" value="${(fund.name||'').replace(/"/g,'&quot;')}">
        <label>${T('fundDetail.editInstLabel')} ${canEditInst ? '' : `<span style="font-weight:400;color:var(--maroon);">${T('fundDetail.editInstLocked')}</span>`}</label>
        <input type="number" id="efInst" value="${fund.installment}" ${canEditInst?'':'disabled'}>
        <button class="btn" id="efSave">${T('common.save')}</button>
        <button class="btn secondary" id="efCancel">${T('common.cancel')}</button>`;
      main.prepend(box); window.scrollTo(0,0);
      document.getElementById("efCancel").onclick = () => box.remove();
      document.getElementById("efSave").onclick = async () => {
        const payload = { profile_id: session.id, fund_id: fundId, name: document.getElementById("efName").value.trim() };
        if (canEditInst) payload.installment = parseFloat(document.getElementById("efInst").value);
        try { await api("editFund", payload); toast(T('fundDetail.fundUpdated')); renderFundDetail(fundId); }
        catch (e) { toast(e.message); }
      };
    };

    const deleteFundBtn = document.getElementById("deleteFundBtn");
    if (deleteFundBtn) deleteFundBtn.onclick = async () => {
      if (!confirm(T('fundDetail.deleteConfirm1')(fund.name))) return;
      if (!confirm(T('fundDetail.deleteConfirm2'))) return;
      try { await api("deleteFund", { profile_id: session.id, fund_id: fundId }); toast(T('fundDetail.fundDeleted')); currentFundId = null; renderShell(); }
      catch (e) { toast(e.message); }
    };
  } catch (e) { main.innerHTML = `<div class="error-box">${e.message}</div>`; }
}

function openShareCredentials(name, phone, pin) {
  // text मुद्दाम plain ठेवलंय (esc() नाही) — हे clipboard/native-share ला जातं, तिथे HTML entities नकोत.
  // innerHTML मध्ये दाखवताना खालीच esc(text) ने escape केलं आहे.
  const text = T('adminTab.credShareText')(name, phone, pin || '0000');
  const main = document.getElementById("mainArea");
  const box = document.createElement("div");
  box.className = "card";
  box.innerHTML = `
    <h2>${T('adminTab.credShareHeading')}</h2>
    <p class="desc">${T('adminTab.credShareDesc')}</p>
    <div class="share-link-box">
      <code style="white-space:pre-wrap;text-align:left;display:block;">${esc(text)}</code>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;">
        <button class="small-btn" id="credCopyBtn">${T('shareLink.copyLink')}</button>
        <button class="small-btn maroon" id="credShareBtn">${T('shareLink.shareBtn')}</button>
      </div>
    </div>
    <button class="btn secondary" id="credCloseBtn" style="margin-top:10px;">${T('common.cancel')}</button>`;
  main.prepend(box);
  window.scrollTo(0, 0);
  document.getElementById("credCopyBtn").onclick = () => { navigator.clipboard.writeText(text); toast(T('shareLink.copied')); };
  document.getElementById("credShareBtn").onclick = async () => {
    if (navigator.share) { try { await navigator.share({ text }); } catch(e){} }
    else { navigator.clipboard.writeText(text); toast(T('shareLink.copiedForShare')); }
  };
  document.getElementById("credCloseBtn").onclick = () => box.remove();
}

function openShareLink(url) {
  const qrImg = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(url)}`;
  const main = document.getElementById("mainArea");
  const box = document.createElement("div");
  box.className = "card";
  box.innerHTML = `
    <h2>${T('shareLink.heading')}</h2>
    <div class="share-link-box">
      <img src="${qrImg}">
      <code>${url}</code>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="small-btn" id="copyLinkBtn">${T('shareLink.copyLink')}</button>
        <button class="small-btn maroon" id="shareNativeBtn">${T('shareLink.shareBtn')}</button>
      </div>
    </div>`;
  main.prepend(box);
  document.getElementById("copyLinkBtn").onclick = () => { navigator.clipboard.writeText(url); toast(T('shareLink.copied')); };
  document.getElementById("shareNativeBtn").onclick = async () => {
    const text = T('shareLink.shareText')(url);
    if (navigator.share) { try { await navigator.share({ title: T('shareLink.shareTitle'), text, url }); } catch(e){} }
    else { navigator.clipboard.writeText(text); toast(T('shareLink.copiedForShare')); }
  };
}

/* ---------------- CSV Export ---------------- */
function toCsv(rows) {
  if (!rows || !rows.length) return "";
  const cols = Object.keys(rows[0]);
  const esc = (v) => { if (v == null) return ""; const s = String(v).replace(/"/g, '""'); return /[",\n]/.test(s) ? `"${s}"` : s; };
  return cols.join(",") + "\n" + rows.map(r => cols.map(c => esc(r[c])).join(",")).join("\n");
}
function downloadCsvZip(data) {
  let out = "";
  for (const [table, rows] of Object.entries(data)) {
    out += `# ${table}\n` + toCsv(rows || []) + "\n\n";
  }
  const blob = new Blob([out], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `chitfund-export-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

    body: {
      mr: "लॉगिन तुमच्या <b>मोबाईल नंबर + PIN</b> ने होतं. नवीन असाल तर 'नवीन Sign up' टॅबवर जा — फक्त नाव, मोबाईल नंबर, 4-6 अंकी PIN, आणि तुमची भाषा (मराठी/हिंदी/English) एवढंच भरा. Telegram ID signup मध्ये लागत नाही — नंतर लॉगिन झाल्यावर <b>Profile</b> टॅबमधल्या '🔔 Telegram सूचना' कार्डमध्ये भरा आणि @chitfindbot ला Telegram वर /start पाठवा — तरच तुम्हाला चिठ्ठी/पेमेंट/रिमाइंडरच्या सूचना मिळतील. Telegram नसेल तरी अ‍ॅप पूर्ण चालतं. पहिला व्यक्ती जो signup करतो तो आपोआप Admin बनतो; त्यानंतरचे सगळे 'pending' राहतात जोपर्यंत Admin त्यांना Approve करत नाही. लॉगिन करताना 'मला लक्षात ठेवा' टिक केलं तर पुढच्या वेळी नंबर+PIN आपोआप भरलेले दिसतील (फक्त स्वतःच्या फोनवर वापरा).",
      hi: "लॉगिन आपके <b>मोबाइल नंबर + PIN</b> से होता है। नए हैं तो 'नया Sign up' टैब पर जाएं — सिर्फ नाम, मोबाइल नंबर, 4-6 अंकों का PIN, और अपनी भाषा (मराठी/हिंदी/English) भरें। Telegram ID signup में नहीं लगती — बाद में लॉगिन के बाद <b>Profile</b> टैब के '🔔 Telegram सूचनाएं' कार्ड में भरें और @chitfindbot को Telegram पर /start भेजें — तभी चिट्ठी/पेमेंट/रिमाइंडर की सूचनाएं मिलेंगी। Telegram न भी हो तो ऐप पूरा चलता है। सबसे पहला signup करने वाला अपने आप Admin बन जाता है; बाकी सभी 'pending' रहते हैं जब तक Admin approve न करे। लॉगिन में 'मुझे याद रखें' टिक करने पर अगली बार नंबर+PIN अपने आप भर जाएंगे (सिर्फ अपने फोन पर करें)।",
      en: "Login is with your <b>mobile number + PIN</b>. New users go to the 'नवीन Sign up' tab — just fill in name, mobile number, a 4-6 digit PIN, and your preferred language (Marathi/Hindi/English). Telegram ID is not asked at signup — add it later after login from the '🔔 Telegram notifications' card in the <b>Profile</b> tab, and send /start to @chitfindbot on Telegram — only then will you receive draw/payment/reminder notifications. The app works fully even without Telegram. The very first person to sign up automatically becomes Admin; everyone after that stays 'pending' until Admin approves them. Ticking 'मला लक्षात ठेवा' on login saves your number+PIN on that phone for next time (only use on your own phone)." } },
  { for: "all", icon: "📒", t: { mr: "फंड्स टॅब", hi: "फंड्स टैब", en: "Funds tab" },
    body: {
      mr: "इथे तुम्ही ज्या चिट फंडांचे मेंबर आहात ते सगळे दिसतात. कुठल्याही फंडावर टॅप केलं की त्याचं आतलं पान उघडतं — मेंबर, चिठ्ठी, पेमेंट सगळं तिथे.",
      hi: "यहां आप जिन चिट फंड के मेंबर हैं वे सभी दिखते हैं। किसी भी फंड पर टैप करने से उसका डिटेल पेज खुलता है — मेंबर, चिट्ठी, पेमेंट सब वहीं।",
      en: "Shows every chit fund you're a member of. Tap any fund to open its detail page — members, draw, payments, all there." } },
  { for: "all", icon: "🎟", t: { mr: "फंडाच्या आत — मेंबर आणि चिठ्ठी", hi: "फंड के अंदर — मेंबर और चिट्ठी", en: "Inside a fund — members & the draw" },
    body: {
      mr: "प्रत्येक महिन्याला Admin 'चिठ्ठी काढा' दाबतो — random विजेता निवडला जातो (किंवा 'Admin निवड' असेल तर Admin ने स्वतः निवडलेला, तेही स्पष्ट लेबल लावून). तुमचं नाव निघालं तर तुम्हाला Telegram वर कळेल आणि बाकी सर्वांना तुमचा UPI/QR जाईल. तुमचं नाव नाही निघालं तर विजेत्याचा UPI/QR तुम्हाला मिळेल — त्यावर हप्ता पाठवा.",
      hi: "हर महीने Admin 'चिट्ठी काढा' दबाता है — random विजेता चुना जाता है (या 'Admin निवड' हो तो Admin ने खुद चुना हुआ, वह भी स्पष्ट लेबल के साथ)। आपका नाम निकला तो आपको Telegram पर पता चलेगा और बाकी सभी को आपका UPI/QR भेजा जाएगा। नाम नहीं निकला तो विजेता का UPI/QR आपको मिलेगा — उस पर किश्त भेजें।",
      en: "Each month Admin taps 'चिठ्ठी काढा' — a random winner is picked (or, if manually chosen, clearly labeled 'Admin निवड'). If you win, you're notified on Telegram and your UPI/QR is sent to everyone else. If not, you receive the winner's UPI/QR — send your installment there." } },
  { for: "all", icon: "💳", t: { mr: "पेमेंट, स्क्रीनशॉट आणि थकीत", hi: "पेमेंट, स्क्रीनशॉट और थकीत", en: "Payments, screenshot proof & overdue" },
    body: {
      mr: "तुमचा हप्ता भरल्यावर स्वतःच्या नावासमोरचा टॅग टॅप करून 'भरला' करा — तेव्हा स्क्रीनशॉट जोडायला (ऐच्छिक) विचारलं जातं; जोडला तर तो फक्त तुम्हाला, विजेत्याला, आणि Admin लाच दिसतो, बाकी कोणालाही नाही. देय तारखेनंतरही न भरल्यास 'थकीत ⚠️' दिसतं.",
      hi: "किश्त भरने पर अपने नाम के सामने वाला टैग टैप करके 'भरला' करें — तब स्क्रीनशॉट जोड़ने का (ऐच्छिक) पूछा जाता है; जोड़ने पर वह सिर्फ आपको, विजेता को, और Admin को दिखता है, किसी और को नहीं। देय तारीख के बाद भी न भरने पर 'थकीत ⚠️' दिखता है।",
      en: "After paying, tap the tag next to your own name to mark 'paid' — you'll be offered an optional screenshot; if added, it's visible only to you, the round's winner, and Admin, no one else. Still unpaid past the due date shows 'थकीत ⚠️' (overdue)." } },
  { for: "all", icon: "🌐", t: { mr: "भाषा बदलणे", hi: "भाषा बदलना", en: "Changing your language" },
    body: {
      mr: "Profile टॅबमध्ये \"भाषा / Language\" मध्ये कधीही मराठी/हिंदी/English बदलू शकता — तुम्हाला येणारे सगळे Telegram मेसेज त्याच भाषेत जातील (Login/Signup स्क्रीनही निवडलेल्या भाषेत दिसते).",
      hi: "Profile टैब में \"भाषा / Language\" से कभी भी मराठी/हिंदी/English बदल सकते हैं — आपको आने वाले सभी Telegram मेसेज उसी भाषा में जाएंगे (Login/Signup स्क्रीन भी चुनी भाषा में दिखती है)।",
      en: "In the Profile tab under \"भाषा / Language\" you can change to Marathi/Hindi/English anytime — all your Telegram messages will then arrive in that language (the Login/Signup screen also follows your chosen language)." } },
  { for: "all", icon: "👤", t: { mr: "प्रोफाईल", hi: "प्रोफाइल", en: "Profile" },
    body: {
      mr: "इथे स्वतःचा फोन, UPI ID, QR कोड, भाषा, आणि '🔔 Telegram सूचना' कार्डमधून <b>Telegram ID</b> भरायचा/बदलायचा असतो. UPI ID भरलेला नसेल तर चिठ्ठीत भाग घेता येत नाही — draw अडतो. QR फाईल टाकली तर बाकी मेंबरना ती फोटोसह Telegram वर मिळते. Telegram ID भरला आणि @chitfindbot ला /start पाठवला तरच तुम्हाला सूचना मिळतील; रिकामा ठेवला तर सूचना बंद (पण अ‍ॅप तसंच चालतं).",
      hi: "यहां अपना फोन, UPI ID, QR कोड, भाषा, और '🔔 Telegram सूचनाएं' कार्ड से <b>Telegram ID</b> भरना/बदलना होता है। UPI ID भरा न हो तो चिट्ठी में भाग नहीं ले सकते — draw रुक जाता है। QR फाइल डाली तो बाकी मेंबर को वह फोटो सहित Telegram पर मिलती है। Telegram ID भरा और @chitfindbot को /start भेजा तभी सूचनाएं मिलेंगी; खाली रखा तो सूचनाएं बंद (पर ऐप वैसे ही चलता है)।",
      en: "Set or update your own phone, UPI ID, QR code, language, and <b>Telegram ID</b> (from the '🔔 Telegram notifications' card) here. Without a UPI ID you can't take part in the draw — it will block until it's filled in. If you upload a QR image, other members receive it as a photo on Telegram. Notifications reach you only if you add a Telegram ID here AND send /start to @chitfindbot; leaving it blank turns notifications off (the app still works)." } },
  { for: "all", icon: "📲", t: { mr: "अ‍ॅप होम स्क्रीनवर install करणं (PWA)", hi: "ऐप होम स्क्रीन पर install करना (PWA)", en: "Installing the app on your home screen (PWA)" },
    body: {
      mr: "Android वर आपोआप 'install' पट्टी दिसते. iPhone वर Safari मध्ये उघडून खालचं Share बटण → 'Add to Home Screen' निवडा.",
      hi: "Android पर अपने आप 'install' पट्टी दिखती है। iPhone पर Safari में खोलकर नीचे Share बटन → 'Add to Home Screen' चुनें।",
      en: "On Android an install banner appears automatically. On iPhone, open in Safari, tap the Share button, then 'Add to Home Screen'." } },
  { for: "all", icon: "📘", t: { mr: "वापर मार्गदर्शक (हेच पान)", hi: "यूज़र गाइड (यही पेज)", en: "User Guide (this page)" },
    body: {
      mr: "हे मार्गदर्शक Profile टॅबमधून कधीही उघडता येतं. Admin असाल तर वर आणखी 'फक्त Admin साठी' सेक्शन दिसतील. यात नवीन फीचर जोडलं की ही यादीही अपडेट होत राहील.",
      hi: "यह गाइड Profile टैब से कभी भी खोला जा सकता है। Admin हैं तो ऊपर 'केवल Admin के लिए' सेक्शन भी दिखेंगे। नया फीचर जुड़ने पर यह सूची भी अपडेट होती रहेगी।",
      en: "This guide can be opened anytime from the Profile tab. If you're Admin, extra 'Admin-only' sections appear too. As new features are added, this list gets updated to match." } },
  { for: "admin", icon: "🎯", t: { mr: "मेंबर जोडणे आणि चिठ्ठी काढणे (Admin)", hi: "मेंबर जोड़ना और चिट्ठी निकालना (Admin)", en: "Adding members & running the draw (Admin)" },
    body: {
      mr: "फंडाच्या आत, ड्रॉपडाउनमधून approved मेंबर निवडून 'फंडमध्ये जोडा'. फंड आधीच सुरू असेल (मागच्या फेऱ्या झालेल्या) तर नवीन मेंबरचे मागचे हप्ते आपोआप 'बाकी' म्हणून नोंदवले जातात (catch-up). 'चिठ्ठी काढा' ने random draw होतो; UPI नसलेले मेंबर असल्यास अडतो — नावं दिसतील. 'विजेता स्वतः निवडा' ने तुम्ही स्वतः ठरवू शकता (पारदर्शक, सर्वांना कळतं). चूक झाली तर 'शेवटची चिठ्ठी रद्द करा'.",
      hi: "फंड के अंदर, ड्रॉपडाउन से approved मेंबर चुनकर 'फंडमध्ये जोडा' दबाएं। फंड पहले से शुरू हो (पिछली फेरियां हो गई हों) तो नए मेंबर की पिछली किश्तें अपने आप 'बाकी' दर्ज हो जाती हैं (catch-up)। 'चिट्ठी काढा' से random draw होता है; UPI न भरे मेंबर हों तो रुक जाता है — नाम दिखेंगे। 'विजेता स्वतः निवडा' से आप खुद चुन सकते हैं (पारदर्शी, सभी को पता चलता है)। गलती हो तो 'शेवटची चिट्ठी रद्द करा'।",
      en: "Inside a fund, pick an approved member from the dropdown and tap 'फंडमध्ये जोडा'. If the fund has already started (past rounds exist), the new member's past installments are automatically recorded as 'pending' (catch-up). 'चिठ्ठी काढा' runs a random draw; it blocks if any member's UPI is missing — names are shown. 'विजेता स्वतः निवडा' lets you pick manually (transparent, everyone is told). Made a mistake? 'शेवटची चिठ्ठी रद्द करा' undoes it." } },
  { for: "admin", icon: "⏰", t: { mr: "रिमाइंडर, हिशोब शेअर आणि थकीत यादी (Admin)", hi: "रिमाइंडर, हिसाब शेयर और थकीत सूची (Admin)", en: "Reminders, ledger sharing & overdue list (Admin)" },
    body: {
      mr: "'बाकी असलेल्यांना रिमाइंडर' आणि 'QR पुन्हा पाठवा' — कोणाला गेलं नाही ते दिसतं (बहुधा त्याने बॉटला /start केलेलं नाही). 'हिशोब Telegram वर शेअर करा' — त्या फेरीचा हिशोब सगळ्या फंड-मेंबरना पाठवतं. Admin टॅबवरचं 'थकीत हप्ते — सर्व फंड एकत्र' कार्ड — सगळ्या फंडांमधलं थकीत एका जागी, टॅप करून त्या फंडात जाता येतं.",
      hi: "'बाकी असलेल्यांना रिमाइंडर' और 'QR पुन्हा पाठवा' — किसे नहीं गया वह दिखता है (ज़्यादातर उसने बॉट को /start नहीं किया)। 'हिसाब Telegram पर शेयर करें' — उस फेरी का हिसाब सभी फंड-मेंबर को भेजता है। Admin टैब का 'थकीत हप्ते — सर्व फंड एकत्र' कार्ड — सभी फंड का थकीत एक जगह, टैप करके उस फंड में जा सकते हैं।",
      en: "'बाकी असलेल्यांना रिमाइंडर' and 'QR पुन्हा पाठवा' — shows who it failed to reach (usually they haven't /start'd the bot). 'हिशोब Telegram वर शेअर करा' sends that round's ledger to every fund member. The Admin tab's 'थकीत हप्ते — सर्व फंड एकत्र' card lists all overdue payments across every fund, tap to jump to that fund." } },
  { for: "admin", icon: "🛡", t: { mr: "मेंबर व्यवस्थापन (Admin)", hi: "मेंबर प्रबंधन (Admin)", en: "Member management (Admin)" },
    body: {
      mr: "'Pending Sign-up Requests' मध्ये approve/नकार. 'सर्व Approved मेंबर' मध्ये Edit, Delete (Admin बनवा/काढा हे आता Edit च्या आतच आहे). Edit उघडल्यावर नाव, फोन (हाच लॉगिन आहे — बदलल्यास मेंबरला कळवा), UPI, Telegram ID, भाषा, PIN, आणि Role — सगळं एकाच फॉर्ममध्ये बदलता येतं. Delete फक्त चिठ्ठी-सुरू-न-झालेल्या फंडातल्या मेंबरसाठी चालतं. 'मेंबर थेट जोडा' ने signup न होता नवीन मेंबर बनवता येतो (मोबाईल नंबर आवश्यक) — जोडल्यावर लगेच एक 'Login तपशील शेअर करा' कार्ड उघडतं, ते Copy/Share करून त्या मेंबरला WhatsApp/SMS ने पाठवा. सर्व जुन्या सदस्यांना 'लॉगिन आता मोबाईल नंबरने' अशी एकवेळची सूचना पाठवण्यासाठी '🔐 सर्व सदस्यांना नवीन लॉगिन कळवा' बटण वापरा (पुढच्या सेक्शनमध्ये).",

let guideLang = "mr";
function renderGuide(backTo) {
  const main = document.getElementById("mainArea");
  const back = backTo || "profile";
  const sections = GUIDE_SECTIONS.filter(s => s.for === "all" || (s.for === "admin" && session.role === "admin"));
  const render = () => {
    main.innerHTML = `
      <button class="link-btn" id="guideBackBtn">‹ मागे / Back</button>
      <div class="card">
        <h2>📘 वापर मार्गदर्शक / User Guide</h2>
        <p class="desc">${session.role === 'admin' ? '👑 Admin साठी सर्व सेक्शन दिसत आहेत / Showing all sections (incl. Admin-only)' : 'सर्व सदस्यांसाठी / For all members'}</p>
        <div class="tabs">
          <div class="tab-toggle ${guideLang==='mr'?'active':''}" id="gLangMr">मराठी</div>
          <div class="tab-toggle ${guideLang==='hi'?'active':''}" id="gLangHi">हिंदी</div>
          <div class="tab-toggle ${guideLang==='en'?'active':''}" id="gLangEn">English</div>
        </div>
      </div>
      <div class="card">
        ${sections.map((s, i) => `
          <div class="list-item" style="cursor:pointer;align-items:flex-start;" data-guide-toggle="${i}">
            <div style="flex:1;">
              <div class="who">${s.icon} ${s.t[guideLang]}${s.for==='admin' ? ' <span class="tag wait" style="font-size:9px;">Admin</span>' : ''}</div>
              <div class="meta" id="guideBody${i}" style="display:none;margin-top:6px;line-height:1.5;white-space:normal;">${s.body[guideLang]}</div>
            </div>
            <span style="font-size:12px;color:var(--muted);">▾</span>
          </div>`).join('')}
      </div>`;
    document.getElementById("guideBackBtn").onclick = () => back === "profile" ? renderProfileTab() : renderShell();
    document.getElementById("gLangMr").onclick = () => { guideLang = "mr"; render(); };
    document.getElementById("gLangHi").onclick = () => { guideLang = "hi"; render(); };
    document.getElementById("gLangEn").onclick = () => { guideLang = "en"; render(); };
    main.querySelectorAll("[data-guide-toggle]").forEach(el => el.onclick = () => {
      const body = document.getElementById("guideBody" + el.dataset.guideToggle);
      body.style.display = body.style.display === "none" ? "block" : "none";
    });
  };
  render();
}

/* ---------------- auto-update (नवीन आवृत्ती आपोआप तपासते; ?v= ची गरज नाही) ----------------
   प्रत्येक deploy ला: खालचा APP_VERSION आकडा +1 करा आणि version.json मधला "v" ही तेवढाच करा. */
const APP_VERSION = 2;
let _updateShown = false;
async function checkForUpdate() {
  if (_updateShown) return;
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (j && typeof j.v === "number" && j.v > APP_VERSION) showUpdateBanner();
  } catch (e) {}
}
function showUpdateBanner() {
  if (_updateShown) return;
  _updateShown = true;
  const bar = document.createElement("div");
  bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#14432E;color:#F6EFDD;display:flex;align-items:center;justify-content:center;gap:12px;padding:11px 14px;font-size:13px;box-shadow:0 -2px 12px rgba(0,0,0,.25);";
  bar.innerHTML = "<span>🔄 नवीन आवृत्ती आली आहे • New version available</span>";
  const btn = document.createElement("button");
  btn.textContent = "रिफ्रेश / Refresh";
  btn.style.cssText = "background:#C6A052;color:#3a2a08;border:none;border-radius:14px;padding:6px 16px;font-weight:700;cursor:pointer;white-space:nowrap;";
  // iOS + Android दोन्हीकडे ताजी HTML मिळावी म्हणून cache-bypass navigation (नुसतं reload केल्यास iOS जुनीच cached देतं)
  btn.onclick = () => { location.replace(location.pathname + "?u=" + Date.now()); };
  bar.appendChild(btn);
  document.body.appendChild(bar);
}
checkForUpdate();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
window.addEventListener("pageshow", checkForUpdate);  // iOS standalone PWA resume
window.addEventListener("focus", checkForUpdate);
setInterval(checkForUpdate, 5 * 60 * 1000);

/* ---------------- boot ---------------- */
// ?signup असलेल्या शेअर-लिंकवरून आल्यास थेट Sign up फॉर्म उघडा
const wantsSignup = new URLSearchParams(location.search).has("signup");
if (session) route("app");
else if (wantsSignup) renderAuth("signup");
else route("auth");
</script>
